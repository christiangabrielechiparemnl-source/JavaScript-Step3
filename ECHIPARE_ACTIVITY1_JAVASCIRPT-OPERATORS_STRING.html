<!DOCTYPE html> <!-- Standard HTML5 declaration tag -->
<html lang="en"> <!-- Sets the document language to English -->
<head> <!-- Metadata and linked styling block -->
  <meta charset="UTF-8"> <!-- UTF-8 character encoding -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- Responsive layout scaling specifier -->
  <title>Profile Message Generator</title> <!-- Window tab title -->
  <link rel="stylesheet" href="string.css"> <!-- Links the external CSS file -->
</head> <!-- End of head element -->
<body> <!-- Visible webpage content markup -->

  <div class="card"> <!-- Display wrapper -->
    <h2>Profile Message Generator</h2> <!-- Main title header -->
    <p id="profileDisplay">Click button to generate profile.</p> <!-- Output placeholder text node -->
    <button onclick="generateProfile()">Generate Profile</button> <!-- Interactive button trigger -->
  </div> <!-- End of wrapper -->

  <script>
    function generateProfile() { // Declares the function that builds the profile message
      let userName = "Alex"; // Declares the string variable userName
      let userRole = "Developer"; // Declares the string variable userRole
      let age = 25; // Declares the number variable age
      let profile = userName + " | " + userRole; // String operator (+) combines name and role into a headline
      profile += " | Age: " + age; // String assignment operator (+=) appends the age (number becomes text)

      document.getElementById("profileDisplay").innerText = profile; // Displays the generated profile string on screen
    } // End of function
  </script> <!-- End of JavaScript block -->

</body> <!-- End of body section -->
</html> <!-- End of HTML document -->
