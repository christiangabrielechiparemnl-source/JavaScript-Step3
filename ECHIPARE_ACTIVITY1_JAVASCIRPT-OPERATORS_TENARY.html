<!DOCTYPE html> <!-- Standard HTML5 specification declaration -->
<html lang="en"> <!-- Sets the document language to English -->
<head> <!-- Metadata and linked styling section -->
  <meta charset="UTF-8"> <!-- UTF-8 character encoding -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- Mobile responsiveness tag -->
  <title>Store Discount Calculator</title> <!-- Window title -->
  <link rel="stylesheet" href="tenary.css"> <!-- Links the external CSS file -->
</head> <!-- End of head block -->
<body> <!-- Visible content body tag -->

  <div class="card"> <!-- Display wrapper -->
    <h2>Store Discount Calculator</h2> <!-- Header title label -->
    <p id="orderOutput">Click button to calculate.</p> <!-- Output text container node -->
    <button onclick="calculateOrder()">Calculate</button> <!-- Function trigger button -->
  </div> <!-- End of wrapper -->

  <script>
    function calculateOrder() { // Declares the function that executes the ternary conditions
      let orderTotal = 250; // Sets the order total to 250
      let shippingFee = (orderTotal >= 200) ? 0 : 50; // Ternary operator (? :) checks 250 >= 200 (true, picks 0 for free shipping)
      let customerStatus = (orderTotal >= 500) ? "VIP" : "Regular"; // Ternary operator (? :) checks 250 >= 500 (false, picks "Regular")

      document.getElementById("orderOutput").innerText = "Order Total: " + orderTotal + " | Shipping Fee: " + shippingFee + " | Customer Status: " + customerStatus; // Displays all values on screen
    } // End of function
  </script> <!-- End of JavaScript block -->

</body> <!-- End of body section -->
</html> <!-- End of HTML document -->
